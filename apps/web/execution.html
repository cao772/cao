<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>开发执行 · CAO</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/execution.css"></head>
<body><main class="execution-shell"><a href="/">← 返回项目总览</a><div class="eyebrow">LOCAL EXECUTION</div><h1>把下一步，变成一次开发</h1><p>CAO 管理任务与证据，Superset 在本机创建独立工作区并启动 Codex。</p>
<section class="panel"><h2>连接本机执行环境</h2><label>平台访问令牌<input id="token" type="password" autocomplete="off" placeholder="仅用于本次页面会话，不保存到浏览器"></label><button id="connect" class="primary-button">连接</button><p id="status" role="status" aria-live="polite">尚未连接</p></section>
<section class="panel"><h2>开始开发</h2><form id="launch"><label>业务项目与仓库<select id="repository" required disabled></select></label><label>任务名称<input id="title" required maxlength="200" placeholder="例如：验证项目资料检索"></label><label>任务 ID<input id="task" required maxlength="200" placeholder="现有任务编号，或为本次手动任务命名"></label><label>给 Codex 的任务说明<textarea id="prompt" rows="5" maxlength="12000" placeholder="留空只启动 Codex，不发起模型请求"></textarea></label><p>每次操作使用隔离 worktree。执行结束后，仍需 Git、PR 和 CI 等证据确认正式完成。</p><button id="start" class="primary-button" disabled>创建工作区并启动 Codex</button></form></section>
<section class="panel"><h2>执行记录</h2><button id="refresh" class="secondary-button" disabled>刷新</button><div id="runs"></div></section></main><script src="/execution.js"></script></body></html>
