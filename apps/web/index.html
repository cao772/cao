<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 研发协同管理平台</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">AI</div>
        <div>
          <h1>研发协同管理</h1>
          <p>Project Intelligence</p>
        </div>
      </div>

      <div class="sidebar-section-title">项目</div>
      <nav id="project-list" class="project-list"></nav>

      <div class="sidebar-footer">
        <span id="api-state" class="health-dot"></span>
        <span id="api-state-text">连接服务...</span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <div class="eyebrow">AI DEV MANAGEMENT</div>
          <h2 id="project-title">研发项目总览</h2>
          <p id="project-subtitle"></p>
        </div>
        <button id="refresh-btn" class="secondary-button" type="button">刷新数据</button>
      </header>

      <section id="overview" class="overview-grid"></section>

      <section class="content-grid">
        <div class="panel panel-wide task-panel">
          <div class="panel-header">
            <div>
              <h3>当前任务</h3>
              <p>只展示正在执行、需要处理和明确待办的事项</p>
            </div>
            <span id="task-scope" class="badge neutral">等待数据</span>
          </div>
          <div id="task-table" class="table-wrap"></div>
        </div>

        <div class="panel">
          <div class="panel-header">
            <div>
              <h3>项目进展</h3>
              <p>以最新资料为主，历史记录保留在周度进展中</p>
            </div>
          </div>
          <div id="project-memory" class="memory-block"></div>
        </div>

        <div class="panel">
          <div class="panel-header">
            <div>
              <h3>人员协作</h3>
              <p>汇总本机接入人员和项目仓库参与人员</p>
            </div>
          </div>
          <div id="contributors" class="contributors"></div>
        </div>

        <div class="panel panel-wide">
          <div class="panel-header">
            <div>
              <h3>每周进展</h3>
              <p>按周查看完成事项、问题、指标和开发动态</p>
            </div>
            <span id="timeline-count" class="badge neutral">0 周</span>
          </div>
          <div id="timeline" class="timeline"></div>
        </div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
