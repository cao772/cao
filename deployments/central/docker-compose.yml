services:
  server:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    environment:
      DB_PATH: /data/project.db
      COLLECTOR_TOKEN: ${COLLECTOR_TOKEN:?set COLLECTOR_TOKEN}
    ports:
      - "8080:8080"
    volumes:
      - project-data:/data
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    ports:
      - "${WEB_PORT:-8088}:80"
    depends_on:
      - server
    restart: unless-stopped

  # Remote GitLab facts are collected once centrally instead of every developer
  # laptop polling the same repositories. Enable with: docker compose --profile gitlab up -d
  gitlab-collector:
    profiles: ["gitlab"]
    build:
      context: ../..
      dockerfile: apps/remote-collector/Dockerfile
    environment:
      GITLAB_BASE_URL: ${GITLAB_BASE_URL:-http://git.hyetec.com}
      # Keep this optional at Compose interpolation time so the base server can run
      # without the gitlab profile. The collector itself fails fast if enabled empty.
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      CENTRAL_URL: http://server:8080
      COLLECTOR_TOKEN: ${COLLECTOR_TOKEN:?set COLLECTOR_TOKEN}
      POLL_INTERVAL_SECONDS: ${GITLAB_POLL_INTERVAL_SECONDS:-300}
      INITIAL_LOOKBACK_HOURS: ${GITLAB_INITIAL_LOOKBACK_HOURS:-24}
    volumes:
      - ../../config/gitlab-projects.yaml:/config/gitlab-projects.yaml:ro
      - remote-collector-state:/state
    depends_on:
      - server
    restart: unless-stopped

volumes:
  project-data:
  remote-collector-state:
