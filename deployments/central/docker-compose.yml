services:
  server:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    environment:
      DB_PATH: /data/project.db
      COLLECTOR_TOKEN: ${COLLECTOR_TOKEN:?set COLLECTOR_TOKEN}
    ports:
      - "8080:8080"
    volumes:
      - project-data:/data
    restart: unless-stopped

volumes:
  project-data:
