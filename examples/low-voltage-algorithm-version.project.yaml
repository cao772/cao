version: 1

project:
  id: low-voltage
  name: 低电压精准立项资料审核智能体
  owner: caoyh
  team: ai-project
  description: >-
    适配真实“algorithm版本管理”目录：项目资料、测试表、问题反馈、标准文件与代码目录混放，
    同时把前端和算法两个 GitLab 仓库归入同一个项目状态。

repositories:
  - id: low-voltage-algorithm
    role: algorithm
    provider: gitlab
    url: http://git.hyetec.com/hyetec/rj26nw011/algorithm.git
    default_branch: ryj
    local_path: algorithm-ryj
    primary: true
    development_branches:
      - ryj
      - cao
      - cyh

  - id: low-voltage-frontend
    role: frontend
    provider: gitlab
    url: http://git.hyetec.com/hyetec/rj26nw011/Front-end/voltage-management.git
    default_branch: main
    # 建议把前端 clone 放到同一受管项目目录下；如果本地目录名不同，只改这里。
    local_path: voltage-management
    primary: false

paths:
  code:
    - algorithm-ryj
    - voltage-management
    - api_servers.py

  documents:
    - '*.xlsx'
    - '*.csv'
    - '*.docx'
    - '*.pdf'

  tests:
    - '*测试*.xlsx'
    - '*问题反馈*.xlsx'
    - '*工作任务*.xlsx'

  outputs: []

ignore:
  - .DS_Store
  - '~$*'
  - '.~*'
  - __MACOSX
  - '*.zip'
  - '*.tar.gz'
  - '*.tgz'
  - 'algorithm-ryj 5'
  - 'algorithm-ryj 7_副本'
  - 金仲铂新需求
  - 生产项目四虚风险智能研判需求整理表.xlsx
  - '副本低电压项目 8.12问题反馈表(5).xlsx'

security:
  mode: local_analysis
  upload_source_code: false
  upload_documents: false

analysis:
  enabled: true
  include:
    - documents
    - tests
    - outputs
  use_llm: false
  max_file_bytes: 8388608
  max_text_chars: 40000
  max_items: 500
  xlsx_rows_per_sheet: 200
  xlsx_columns: 30
  csv_rows: 500
  csv_columns: 50
  pdf_pages: 50

  git_changes:
    enabled: true
    use_llm: false
    max_files: 80
    max_diff_chars_per_file: 12000

progress:
  sources:
    - git
    - tests
    - local_workspace
    - tasks
    - agent
    - ci
