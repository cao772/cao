version: 1

project:
  id: power-defect-agent
  name: 基于多模态大模型及智能体的电力设备缺陷处置
  owner: caoyh
  team: ai-project

repository:
  provider: github
  url: https://github.com/cao772/multimodal-agent.git
  default_branch: cyh
  development_branches:
    - cyh

paths:
  # 代码只用于 Git/代码变化分析，不在第一阶段做全量正文上送。
  code:
    - backend
    - defect_image_exporter_release_v0.1.1
    - power-defect-disposal-skill

  # 真实项目资料大量直接放在项目根目录，因此支持 glob。
  documents:
    - README.md
    - SKILL.md
    - CODEX_MERGE_PROMPT.md
    - docs
    - power-defect-disposal-skill
    - '*.md'
    - '*.docx'
    - '*.xlsx'
    - '*.pptx'

  tests:
    - backend/tests

  outputs:
    - outputs

ignore:
  # macOS / Office / IDE 临时文件
  - __MACOSX
  - .DS_Store
  - '.~*'
  - '~$*'
  - .idea

  # 浏览器回放、临时制表脚本及其截图，不作为项目主资料
  - .playwright-cli
  - .work_feature_list

  # 数据样本和图片规模较大；第一阶段只通过 Git/目录状态感知，不做全文分析
  - data/demo/images
  - '*.jpg'
  - '*.jpeg'
  - '*.png'
  - '*.mp4'

  # 本交接包里包含一份旧的/重复的 handoff v2，保留在磁盘但不进入当前视图。
  - power_defect_agent_handoff_v2

  # 与当前缺陷项目无关的低电压 Docker 替换包。
  - lowvoltage_cyh_docker_replace_de14133_20260822

security:
  mode: local_analysis
  upload_source_code: false
  upload_documents: false

analysis:
  enabled: true
  include:
    - documents
    - tests
    - outputs
  use_llm: false
  max_file_bytes: 8388608
  max_text_chars: 40000
  max_items: 500
  xlsx_rows_per_sheet: 200
  xlsx_columns: 30

progress:
  sources:
    - git
    - tests
    - local_workspace
    - tasks
    - agent
    - ci
