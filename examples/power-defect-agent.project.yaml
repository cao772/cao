version: 1

project:
  id: power-defect-agent
  name: 基于多模态大模型及智能体的电力设备缺陷处置
  owner: caoyh
  team: ai-project

repository:
  id: multimodal-agent
  role: application
  provider: gitlab
  url: http://git.hyetec.com/hyetec/rj26nw025/multimodal-agent.git
  default_branch: cyh
  local_path: .
  development_branches:
    - cyh

paths:
  code:
    - backend
    - defect_image_exporter_release_v0.1.1
    - power-defect-disposal-skill

  documents:
    - README.md
    - SKILL.md
    - CODEX_MERGE_PROMPT.md
    - docs
    - power-defect-disposal-skill
    - '*.md'
    - '*.docx'
    - '*.xlsx'
    - '*.pptx'

  tests:
    - backend/tests

  outputs:
    - outputs

ignore:
  - __MACOSX
  - .DS_Store
  - '.~*'
  - '~$*'
  - .idea
  - .playwright-cli
  - .work_feature_list
  - data/demo/images
  - '*.jpg'
  - '*.jpeg'
  - '*.png'
  - '*.mp4'
  - power_defect_agent_handoff_v2
  - lowvoltage_cyh_docker_replace_de14133_20260822

security:
  mode: local_analysis
  upload_source_code: false
  upload_documents: false

analysis:
  enabled: true
  include:
    - documents
    - tests
    - outputs
  use_llm: false
  max_file_bytes: 8388608
  max_text_chars: 40000
  max_items: 500
  xlsx_rows_per_sheet: 200
  xlsx_columns: 30

progress:
  sources:
    - git
    - tests
    - local_workspace
    - tasks
    - agent
    - ci
