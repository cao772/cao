name: CI

on:
  push:
    branches:
      - cao
  pull_request:
    branches:
      - main
      - cao

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/local-sentinel/requirements.txt -r apps/server/requirements.txt -r apps/remote-collector/requirements.txt pytest
          pip check

      - name: Compile Python
        run: python -m compileall -q apps

      - name: Run tests
        env:
          PYTHONPATH: apps/local-sentinel:apps/server:apps/remote-collector
        run: python -m pytest -q apps/local-sentinel/tests apps/server/tests apps/remote-collector/tests

      - name: Validate dashboard JavaScript
        run: node --check apps/web/app.js

      - name: Validate configs
        env:
          COLLECTOR_TOKEN: ci-test-token
        run: |
          python - <<'PY'
          import json, yaml
          from pathlib import Path
          json.loads(Path('schemas/project.schema.json').read_text())
          cfg = yaml.safe_load(Path('config/gitlab-projects.yaml').read_text())
          assert cfg['version'] == 1
          assert len(cfg['projects']) >= 3
          PY
          docker compose -f deployments/central/docker-compose.yml config >/dev/null
          GITLAB_TOKEN=ci-gitlab-token docker compose -f deployments/central/docker-compose.yml --profile gitlab config >/dev/null
          PROJECTS_PATH=/tmp/projects CENTRAL_URL=http://localhost:8080 USER_ID=ci DEVICE_ID=ci-device \
            docker compose -f deployments/local/docker-compose.yml config >/dev/null

      - name: Build containers
        run: |
          docker build -f apps/local-sentinel/Dockerfile -t ai-dev-sentinel:test .
          docker build -f apps/server/Dockerfile -t ai-dev-server:test .
          docker build -f apps/remote-collector/Dockerfile -t ai-dev-gitlab-collector:test .
          docker build -f apps/web/Dockerfile -t ai-dev-web:test .
